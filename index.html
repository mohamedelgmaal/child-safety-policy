<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Tahoma, Arial, sans-serif;
    }

    body{
        background:#f5f7fb;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .contact-card{
        background:#fff;
        max-width:450px;
        width:100%;
        text-align:center;
        padding:40px 30px;
        border-radius:20px;
        box-shadow:0 15px 40px rgba(0,0,0,.08);
    }

    .icon-container{
        width:90px;
        height:90px;
        margin:0 auto 20px;
        border-radius:50%;
        background:linear-gradient(135deg,#7b2cff,#5a1ccc);
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .mail-icon{
        font-size:40px;
        color:#fff;
    }

    .mail-icon::before{
        content:"✉";
    }

    h1{
        color:#222;
        margin-bottom:15px;
    }

    p{
        color:#666;
        line-height:1.8;
        margin-bottom:25px;
    }

    .btn-connect{
        display:inline-block;
        background:#7b2cff;
        color:#ffffff;
        text-decoration:none;
        padding:16px 20px;
        border-radius:14px;
        font-size:16px;
        font-weight:bold;
        box-shadow:0 8px 20px rgba(123,44,255,.3);
        transition:all .3s ease;
    }

    .btn-connect:hover{
        background:#5a1ccc;
        transform:translateY(-2px);
        box-shadow:0 10px 25px rgba(123,44,255,.4);
    }

    .btn-connect:active{
        transform:translateY(1px);
    }

    .footer-text{
        margin-top:25px;
        font-size:13px;
        color:#999;
    }
</style>
</head>

<body>

<div class="contact-card">

    <div class="icon-container">
        <div class="mail-icon"></div>
    </div>

    <h1>تواصل معنا الآن</h1>

    <p>
        اضغط على الزر أدناه لفتح Gmail مباشرة وإرسال رسالة إلكترونية،
        وسنقوم بالرد عليك في أقرب وقت ممكن.
    </p>

    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=elpopmaya@gmail.com&su=استفسار&body=مرحباً، أريد التواصل معكم"
       target="_blank"
       class="btn-connect">
        إرسال رسالة إلكترونية
    </a>

    <div class="footer-text">
        elpopmaya@gmail.com
    </div>

</div>

</body>
</html>
