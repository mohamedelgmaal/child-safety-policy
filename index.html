<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج الاتصال بالأعضاء</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .submit-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>تواصل معنا</h2>
    <!-- تم ربط النموذج بخدمة Formspree وتوجيهه لبريدك الإلكتروني مباشرة -->
    <form action="https://formspree.io" method="POST">
        
        <div class="form-group">
            <label for="name">اسم العضو:</label>
            <input type="text" id="name" name="name" required placeholder="أدخل اسمك هنا">
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني للعضو:</label>
            <input type="email" id="email" name="_replyto" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="message">نص الرسالة:</label>
            <textarea id="message" name="message" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>
        </div>

        <button type="submit" class="submit-btn">إرسال الرسالة</button>
    </form>
</div>

</body>
</html>
