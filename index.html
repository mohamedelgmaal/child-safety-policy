<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f5f7ff,#ece8ff);
    padding:20px;
}

.contact-card{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:24px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
    text-align:center;
}

.icon{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(135deg,#7b2cff,#5a1ccc);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:40px;
}

h1{
    color:#222;
    margin-bottom:12px;
}

.desc{
    color:#666;
    line-height:1.8;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:15px;
}

input,
textarea{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus,
textarea:focus{
    border-color:#7b2cff;
    box-shadow:0 0 0 4px rgba(123,44,255,.12);
}

textarea{
    resize:vertical;
    min-height:140px;
}

button{
    width:100%;
    border:none;
    background:#7b2cff;
    color:#fff;
    padding:16px;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#5a1ccc;
    transform:translateY(-2px);
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:13px;
}
</style>
</head>

<body>

<div class="contact-card">

    <div class="icon">✉</div>

    <h1>تواصل معنا</h1>

    <p class="desc">
        اترك رسالتك وسنقوم بالرد عليك في أقرب وقت ممكن.
    </p>

    <form action="https://formsubmit.co/elpopmaya@gmail.com" method="POST">

        <!-- إلغاء الكابتشا -->
        <input type="hidden" name="_captcha" value="false">

        <!-- صفحة الشكر بعد الإرسال -->
        <input type="hidden" name="_next" value="thankyou.html">

        <div class="form-group">
            <input type="text" name="الاسم" placeholder="الاسم بالكامل" required>
        </div>

        <div class="form-group">
            <input type="email" name="البريد الإلكتروني" placeholder="البريد الإلكتروني" required>
        </div>

        <div class="form-group">
            <textarea name="الرسالة" placeholder="اكتب رسالتك هنا..." required></textarea>
        </div>

        <button type="submit">
            إرسال الرسالة
        </button>

    </form>

    <div class="footer">
        جميع الرسائل تصل مباشرة إلى: elpopmaya@gmail.com
    </div>

</div>

</body>
</html>
